{% extends 'control/base.html' %}

{% block content %}
<style>
    .tarjeta-login {
        background-color: var(--card-bg);
        padding: 40px 35px;
        border-radius: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        border: 2px solid var(--border-color);
        width: 100%;
        max-width: 400px;
        box-sizing: border-box;
        text-align: center;
        transition: background-color 0.3s, border-color 0.3s;
    }

    .tarjeta-login h2 {
        color: var(--text-heading);
        margin-top: 10px;
        margin-bottom: 25px;
        font-size: 1.8rem;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .tarjeta-login .form-group {
        text-align: left;
        margin-bottom: 18px;
    }

    .tarjeta-login label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
        color: var(--text-heading);
        font-size: 14px;
    }

    .tarjeta-login input[type="text"],
    .tarjeta-login input[type="password"] {
        width: 100%;
        padding: 12px 15px;
        border: 1.5px solid var(--border-color);
        border-radius: 12px;
        background-color: var(--input-bg);
        color: var(--text-main);
        font-size: 15px;
        outline: none;
        box-sizing: border-box;
        transition: all 0.2s ease;
    }

    .tarjeta-login input:focus {
        border-color: var(--text-heading);
        box-shadow: 0 0 8px rgba(249, 224, 234, 0.5);
    }

    .btn-ingresar {
        width: 100%;
        background-color: var(--btn-guardar);
        color: var(--text-heading);
        border: none;
        padding: 14px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 15px;
        cursor: pointer;
        margin-top: 8px;
        transition: all 0.2s ease;
    }

    .btn-ingresar:hover {
        filter: brightness(0.95);
        transform: translateY(-1px);
    }

    .error-alerta {
        background-color: var(--btn-eliminar);
        color: #B85C74;
        padding: 10px;
        border-radius: 10px;
        margin-bottom: 18px;
        font-size: 13px;
        font-weight: 500;
    }
</style>

<div class="tarjeta-login">
    <div style="font-size: 36px; line-height: 1;">✨</div>
    <h2>Iniciar sesión</h2>

    {% if form.errors %}
        <div class="error-alerta">
            Usuario o contraseña incorrectos.
        </div>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <input type="hidden" name="next" value="{{ next }}">

        <div class="form-group">
            <label>Usuario</label>
            <input type="text" name="username" required autocomplete="username">
        </div>

        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" name="password" required autocomplete="current-password">
        </div>

        <button type="submit" class="btn-ingresar">
            Ingresar ✨
        </button>
    </form>
</div>
{% endblock %}
